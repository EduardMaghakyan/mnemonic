[workspace]
resolver = "2"
members = ["core", "cli", "app"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Eduard Maghakyan <edi.maghakyan@gmail.com>"]
rust-version = "1.91"

[workspace.dependencies]
mnemonic-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
